# 本番に出す前のチェック（秘密の値・参照ファイル・フォームの接続設定・フォントの文字・wrangler の設定）。
# プルリクエストで実行し、deploy.yml（本番）と preview.yml（ブランチ）からも呼ばれる。
name: Check

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: npm ci
      - run: pip install -r scripts/requirements.txt
      - run: npm run check
