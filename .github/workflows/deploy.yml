# main への push で、チェック → 本番デプロイ → 本番の確認 → タグとリリースノート、の順に実行する。
# public/ などの公開物が変わったときだけ動く（docs や supabase/ だけの変更では本番に出さない・タグも打たない）。
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "wrangler.jsonc"
      - "src/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/check.yml

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://paddleon.app/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 本番にデプロイ
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --message "${GITHUB_SHA::7}"
      - name: 本番の確認
        run: |
          # 今回のファイルと同じ内容が配信されるまで待つ（最大2分）
          want=$(sha256sum public/index.html | cut -d' ' -f1)
          for i in $(seq 1 24); do
            got=$(curl -fsS https://paddleon.app/ | sha256sum | cut -d' ' -f1 || true)
            [ "$got" = "$want" ] && break
            sleep 5
          done
          [ "$got" = "$want" ] || { echo "::error::本番の index.html が今回のファイルと一致しません"; exit 1; }
          fail=0
          for p in / /privacy /robots.txt /sitemap.xml /og.jpg /favicon.svg /apple-touch-icon.png /video/demo-screen.mp4 /fonts/zkgn-700.woff2; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://paddleon.app$p")
            echo "$p $code"; [ "$code" = 200 ] || fail=1
          done
          # iPhone の Safari は動画を部分配信（206）でしか再生しない
          for f in demo-screen.mp4 demo-screen.webm; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Range: bytes=0-1' "https://paddleon.app/video/$f")
            echo "/video/$f Range $code（206 が正しい）"; [ "$code" = 206 ] || fail=1
          done
          for p in /README.md /wrangler.jsonc /package.json /src/worker.js; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://paddleon.app$p")
            echo "$p $code（404 が正しい）"; [ "$code" = 404 ] || fail=1
          done
          exit $fail

  release:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: タグとリリースノートを作成
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # タグは日付（日本時間）。同じ日に2回目以降は .2, .3 … を付ける
          base="v$(TZ=Asia/Tokyo date +%Y.%m.%d)"
          tag="$base"; n=1
          while git rev-parse -q --verify "refs/tags/$tag" >/dev/null; do n=$((n+1)); tag="$base.$n"; done
          prev=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          range=${prev:+$prev..}HEAD
          {
            echo "https://paddleon.app/ に公開した版です。"
            echo
            echo "## 変更"
            git log --no-merges --pretty='- %s (%h)' $range -- public wrangler.jsonc package.json
            echo
            echo "<details><summary>この版に含まれるすべてのコミット</summary>"
            echo
            git log --no-merges --pretty='- %s (%h)' $range
            echo
            echo "</details>"
            if [ -n "$prev" ]; then
              echo
              echo "差分: https://github.com/${GITHUB_REPOSITORY}/compare/$prev...$tag"
            fi
          } > notes.md
          cat notes.md
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file notes.md
