# main への push で、チェック → 本番デプロイ → 本番の確認 → タグとリリースノート、の順に実行する。
# public/ などの公開物が変わったときだけ動く（docs や supabase/ だけの変更では本番に出さない・タグも打たない）。
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "wrangler.jsonc"
      - "src/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/check.yml

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://paddleon.app/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 本番にデプロイ
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --message "${GITHUB_SHA::7}"
      - name: 本番の確認
        run: |
          # 新しい版が Cloudflare に行き渡るまで少し時間がかかるので、全部通るまで最大2分くり返す
          verify() {
            local fail=0 code p f
            # 今回のファイルと同じ内容が配信されているか
            for f in index.html:/ privacy.html:/privacy index.md:/index.md auth.md:/auth.md .well-known/api-catalog:/.well-known/api-catalog; do
              want=$(sha256sum "public/${f%%:*}" | cut -d' ' -f1)
              got=$(curl -fsS "https://paddleon.app${f##*:}" | sha256sum | cut -d' ' -f1 || true)
              [ "$got" = "$want" ] && echo "${f##*:} 内容一致" || { echo "${f##*:} 内容が今回のファイルと違います"; fail=1; }
            done
            for p in /robots.txt /sitemap.xml /og.jpg /favicon.svg /apple-touch-icon.png /video/demo-screen.mp4 /fonts/zkgn-700.woff2; do
              code=$(curl -s -o /dev/null -w '%{http_code}' "https://paddleon.app$p")
              echo "$p $code"; [ "$code" = 200 ] || fail=1
            done
            # iPhone の Safari は動画を部分配信（206）でしか再生しない
            for f in demo-screen.mp4 demo-screen.webm; do
              code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Range: bytes=0-1' "https://paddleon.app/video/$f")
              echo "/video/$f Range ${code}（206 が正しい）"; [ "$code" = 206 ] || fail=1
            done
            # AI が Accept: text/markdown で要求したら Markdown、指定がなければ HTML が返るか
            md=$(curl -s -o /dev/null -w '%{content_type}' -H 'Accept: text/markdown' https://paddleon.app/)
            html=$(curl -s -o /dev/null -w '%{content_type}' https://paddleon.app/)
            echo "Accept: text/markdown → $md ／ 指定なし → $html"
            case "$md" in text/markdown*) ;; *) fail=1;; esac
            case "$html" in text/html*) ;; *) fail=1;; esac
            # AI 向けの案内（Link ヘッダーと API カタログの種類）と、コンテンツの使い方の宣言（Content-Signal）
            head=$(curl -s -D - -o /dev/null https://paddleon.app/ | tr -d '\r')
            echo "$head" | grep -i '^link:' | grep -q 'rel="api-catalog"' && echo "Link ヘッダーあり" || { echo "Link ヘッダーなし"; fail=1; }
            echo "$head" | grep -qi '^content-signal:' && echo "Content-Signal あり" || { echo "Content-Signal なし"; fail=1; }
            cat_type=$(curl -s -o /dev/null -w '%{content_type}' https://paddleon.app/.well-known/api-catalog)
            echo "api-catalog → $cat_type"; case "$cat_type" in application/linkset+json*) ;; *) fail=1;; esac
            # 公開してはいけないファイル
            for p in /README.md /wrangler.jsonc /package.json /src/worker.js /_headers; do
              code=$(curl -s -o /dev/null -w '%{http_code}' "https://paddleon.app$p")
              echo "$p ${code}（404 が正しい）"; [ "$code" = 404 ] || fail=1
            done
            return $fail
          }
          for i in $(seq 1 12); do
            if verify > result.txt 2>&1; then cat result.txt; echo "本番の確認: OK（${i}回目）"; exit 0; fi
            sleep 10
          done
          cat result.txt
          echo "::error::本番の確認に失敗しました"
          exit 1

  release:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: タグとリリースノートを作成
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # タグは日付（日本時間）。同じ日に2回目以降は .2, .3 … を付ける
          base="v$(TZ=Asia/Tokyo date +%Y.%m.%d)"
          tag="$base"; n=1
          while git rev-parse -q --verify "refs/tags/$tag" >/dev/null; do n=$((n+1)); tag="$base.$n"; done
          prev=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          range=${prev:+$prev..}HEAD
          {
            echo "https://paddleon.app/ に公開した版です。"
            echo
            echo "## 変更"
            git log --no-merges --pretty='- %s (%h)' $range -- public wrangler.jsonc package.json
            echo
            echo "<details><summary>この版に含まれるすべてのコミット</summary>"
            echo
            git log --no-merges --pretty='- %s (%h)' $range
            echo
            echo "</details>"
            if [ -n "$prev" ]; then
              echo
              echo "差分: https://github.com/${GITHUB_REPOSITORY}/compare/$prev...$tag"
            fi
          } > notes.md
          cat notes.md
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file notes.md
