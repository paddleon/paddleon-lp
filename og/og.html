  OGP 画像（public/og.jpg）の元になるページ。og/build.sh が Chrome でこのページを 1200×630 で撮影して og.jpg を作る。
  文言・フォント・アプリ画面を変えるときは、ここを直して build.sh を実行する。
  他社のロゴ（Apple のマークなど）やストア名は入れない（CLAUDE.md「商標とロゴ」）。
-->
<link rel="preconnect" href="https://fonts.googleapis.com">

@font-face{font-family:'Zen Kaku Gothic New';font-weight:900;src:url(../public/fonts/zkgn-900.woff2) format('woff2')}
*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{position:relative;font-family:'Zen Kaku Gothic New',sans-serif;color:#0A0F1A;
  background:#F3D9C6 url(../public/img/hero-bg.webp) no-repeat;background-size:var(--bg-w) auto;background-position:var(--bg-x) var(--bg-y);
  --bg-w:2330px;--bg-x:-480px;--bg-y:-180px}
.logo{position:absolute;left:90px;top:52px;display:flex;align-items:center;height:43px;padding:0 14px;border-radius:10px;background:#070E1A}
h1{position:absolute;left:90px;top:118px;margin:0;font-weight:900;font-size:90px;line-height:1.25;letter-spacing:.01em;text-indent:-.5em;padding-left:.5em;margin-left:-.5em;white-space:nowrap}
.tagline{position:absolute;left:92px;top:352px;font-family:'Square Peg',cursive;font-size:84px;line-height:1;white-space:nowrap;transform:rotate(-3deg);transform-origin:left center}
.cta{position:absolute;left:90px;top:498px;display:flex;align-items:center;justify-content:center;width:404px;height:68px;border-radius:16px;background:#FFD23F;font-weight:900;font-size:27px;letter-spacing:.02em}
/* アプリの画面（LP の .iphone と同じ作り） */
.iphone{--w:262px;position:absolute;left:878px;top:58px;width:var(--w);padding:3px;border-radius:calc(var(--w)*.19);background:linear-gradient(145deg,#5A5F69 0%,#2A2D33 22%,#1B1D21 50%,#2A2D33 78%,#50545D 100%);box-shadow:0 30px 60px rgba(0,0,0,.45),0 0 0 1px rgba(0,0,0,.6);transform:rotate(4deg)}
.iphone .bz{padding:calc(var(--w)*.03);border-radius:calc(var(--w)*.19 - 3px);background:#050608}
.iphone img{display:block;width:100%;height:auto;aspect-ratio:780/1688;object-fit:cover;border-radius:calc(var(--w)*.16 - 3px)}
.iphone .di{position:absolute;left:50%;top:calc(3px + var(--w)*.058);width:calc(var(--w)*.28);aspect-ratio:126/37;transform:translateX(-50%);border-radius:999px;background:#000}
.note{position:absolute;right:26px;bottom:14px;font-weight:700;font-size:15px;color:rgba(255,255,255,.85);text-shadow:0 1px 3px rgba(0,0,0,.5)}
</style>
